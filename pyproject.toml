[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusealign-hub"
version = "0.1.0"
description = "FuseAlign word-level forced aligner (multilingual CJK fine-tune, step 2500) for torch.hub"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zyphra" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchaudio>=2.5", "transformers>=4.57", "safetensors>=0.4",
                "huggingface_hub>=0.30", "silero-vad>=6.2.3"]

[project.urls]
Repository = "https://github.com/Zyphra/fusealign-multilingual"
Weights = "https://huggingface.co/Zyphra/fusealign"
Paper = "https://arxiv.org/abs/2609.33650"

[dependency-groups]
dev = ["pytest", "gguf==0.19.0"]

[tool.setuptools.packages.find]
include = ["fusealign_hub*"]

[tool.uv]
# Development lock: torch/torchaudio 2.9.1 (PyPI's Linux wheels are the cu128 build) and the versions below.
# Constraints apply only when this repo is the uv project, never to consumers.
constraint-dependencies = ["torch==2.9.1", "torchaudio==2.9.1", "transformers==4.57.3",
                           "safetensors==0.7.0", "huggingface-hub==0.36.0", "pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
